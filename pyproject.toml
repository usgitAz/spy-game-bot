[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "spy-game-bot"
version = "0.1.0"
description = "Spy Game Telegram Bot"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.30.0",
    "aiohttp>=3.14.0",
    "aiofiles>=25.1.0",
    "aiohttp-socks>=0.12.0",
    "python-socks>=3.0.0",
    "pydantic>=2.13.0",
    "pydantic-settings>=2.15.0",
    "SQLAlchemy>=2.0.52",
    "asyncpg>=0.31.0",
    "alembic>=1.19.0",
    "redis>=8.1.0",
    "python-dotenv>=1.2.0",
    "structlog>=26.1.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.16.4",
    "pre-commit>=4.6.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
force-exclude = true
line-length = 88
target-version = "py312"
fix = false
show-fixes = true
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "venv",
    "env",
    ".env",
    "build",
    "dist",
    "*.pyc",
    "migrations",
    "tests",
    ".direnv",
    ".mypy_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".vscode",
    "__pypackages__",
    "_build",
    "site-packages",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "A", "D"]
extend-select = ["D400", "D401", "D415", "D417"]
ignore = [
    "E501",
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "D105",
    "D106",
    "D107",
    "D401",
    "D205",
]

[tool.ruff.lint.isort]
known-first-party = ["app"]
combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "D100", "D101", "D102", "D103", "D104"]
"**/__init__.py" = ["F403", "F811", "F401", "I001", "D104"]
"app/main.py" = ["E402"]
